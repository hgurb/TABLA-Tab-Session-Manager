<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>TABLA</title><script src="theme.js"></script><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body><header><img src="icons/icon32.png" width="25" height="25" alt=""><h1>TABLA</h1><span id="window-info">This window</span><button id="open-settings" data-action="settings" type="button" aria-label="Open settings" title="Open settings"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 3-.6 2.2-2 .9-2.1-.6-2.3 4 1.6 1.6v2L2 14.5l2.3 4 2.1-.6 2 .9L9 21h6l.6-2.2 2-.9 2.1.6 2.3-4-1.6-1.4v-2L22 9.5l-2.3-4-2.1.6-2-.9L15 3Z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
<main>
<section class="organize"><div class="organize-heading"><h2>Organize this window</h2><label class="auto-group-switch" title="Automatically group newly opened tabs"><span>Auto-group</span><input id="auto-group-toggle" type="checkbox" role="switch" aria-label="Automatically group newly opened tabs" disabled></label></div><div class="group-actions"><button title="Group this window using your saved grouping rules" class="group-action" data-action="group" type="button"><span class="action-symbol" aria-hidden="true">▦</span><span>Group tabs<small>Use your saved grouping rules</small></span><span class="group-tabs-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="2" y="3" width="20" height="18" rx="3"/><rect x="6" y="8" width="5" height="9" rx="1"/><rect x="13" y="8" width="5" height="9" rx="1"/><path d="M6 11h5m2 0h5"/></svg></span></button><button class="window-ungroup" data-action="ungroup" type="button" title="Ungroup all tabs in this window">Ungroup<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><rect x="2" y="4" width="7" height="16" rx="2"/><rect x="15" y="4" width="7" height="16" rx="2"/><path d="M2 9h7m6 0h7"/></svg></button></div><div class="pair quiet strip-actions"><button data-action="move-left" type="button" title="Move all groups to the left, after pinned tabs"><svg class="direction direction-left" viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg> Move left</button><button data-action="collapse" type="button"><svg class="direction direction-right" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg> Collapse <svg class="direction direction-left" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg></button><button data-action="expand" type="button"><svg class="direction direction-left" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg> Expand <svg class="direction direction-right" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg></button><button data-action="move-right" type="button" title="Move all groups to the right">Move right <svg class="direction direction-right" viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg></button></div></section>
<details class="all-windows" id="all-windows"><summary>Organize all windows<span id="all-windows-info" title="All regular Chrome windows"></span></summary><div class="all-window-actions"><div class="group-actions"><button title="Group all regular windows using your saved grouping rules" class="group-action" data-action="group-all" type="button"><span>Group windows</span><span class="group-tabs-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 6V3h14v12h-3"/><rect x="2" y="8" width="15" height="13" rx="2"/><path d="M2 12h15m-11 4h3m3 0h1"/></svg></span></button><button class="window-merge" data-action="merge-windows" type="button" title="Move tabs and groups from other regular windows into this window">Merge windows<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 7h18m-15 4 4 4-4 4m12-8-4 4 4 4"/></svg></button><button class="window-ungroup" data-action="ungroup-all" type="button" title="Ungroup all tabs in every regular window">Ungroup<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><rect x="2" y="4" width="7" height="16" rx="2"/><rect x="15" y="4" width="7" height="16" rx="2"/><path d="M2 9h7m6 0h7"/></svg></button></div><div class="pair quiet strip-actions"><button data-action="move-left-all" type="button" title="Move all groups left in every regular window, after pinned tabs"><svg class="direction direction-left" viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg> Move left</button><button data-action="collapse-all" type="button"><svg class="direction direction-right" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg> Collapse <svg class="direction direction-left" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg></button><button data-action="expand-all" type="button"><svg class="direction direction-left" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg> Expand <svg class="direction direction-right" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg></button><button data-action="move-right-all" type="button" title="Move all groups right in every regular window">Move right <svg class="direction direction-right" viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 5 5 5-5 5m6-10 5 5-5 5"/></svg></button></div></div></details>
<section class="save-area"><h2>Save for later</h2><label class="sr-only" for="session-name">Session name (optional)</label><div class="session-entry"><input id="session-name" maxlength="100" placeholder="Name this session (optional)"><div class="pair"><button id="save-session" type="button">Save</button><button class="accent" id="save-close-session" type="button">Save &amp; close</button></div></div></section>
<section class="recent"><div class="list-heading"><h2>Saved sessions <span id="session-count"></span></h2><a id="open-library" href="sessions.html" target="_blank">Open library ↗</a></div><p id="empty" class="muted">Your saved sessions will appear here.</p><div id="sessions"></div></section>
<div class="popup-bottom"><details id="more"><summary>More actions</summary><nav aria-label="More actions"><button data-action="settings" type="button">Settings</button><button data-action="domain" type="button">Group this window by domain</button><button data-action="source" type="button">Group this window by source tab</button><button data-action="undo" type="button">Undo last grouping change in this window</button><button id="pause" data-action="pause" type="button">Pause automatic grouping</button><button data-action="recovery" type="button">Recovery and backups</button><button data-action="whats-new" type="button">What’s new</button></nav></details><a id="more-sessions" href="sessions.html" target="_blank" hidden>More sessions ↗</a></div>
<p id="status" class="popup-status" role="status" aria-atomic="true"></p>
</main></body></html>
